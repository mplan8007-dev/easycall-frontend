name: Work account registration checks
on:
  push:
    branches: ["feat/work-account-registration", "main", "feat/optional-password-change", "feat/agent-account-bulk", "feat/agent-common-password", "feat/simple-agent-onboarding", "feat/dual-call-transport", "feat/dual-call-transport-assets", "feat/new-camp-call-transport", "feat/responsive-device-layout", "fix/imported-voter-refresh", "fix/verified-voter-import", "fix/password-admin-voters", "fix/contact-import-lifecycle", "fix/session-refresh-flash", "feat/contact-management"]
    paths: ["voter-import-ui.js", "runtime-scaling.js", "access-and-lists.js", "responsive.css", "responsive-layout.js", "call-integration.js", "call-transport.mjs", "vendor/**", "agent-common-password.js", "loadtest/bootstrap.sql", "agent-accounts.js", "agent-account-tools.mjs", "camp-admin-accounts.js", "work-accounts.js", "admin-console.js", "index.html", "tests/**", "supabase/**", ".github/workflows/work-accounts.yml"]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.4.5
      - name: Frontend and policy regression
        run: node --test tests/password-change.test.cjs tests/voter-import.test.cjs tests/operations.test.cjs tests/admin-console.test.cjs tests/access-and-lists.test.cjs tests/runtime-scheduler.test.cjs tests/runtime-scaling.test.cjs tests/work-accounts.test.cjs tests/agent-account-tools.test.cjs tests/common-password.test.cjs tests/call-transport.test.cjs
      - name: Edge function type check
        run: deno check supabase/functions/easycall-work-accounts/index.ts
      - name: Browser account flow checks
        run: |
          npm install --no-save playwright@1.56.1 tailwindcss@3.4.17
          npx playwright install --with-deps chromium
          node tests/work-accounts-browser.cjs
          node tests/camp-admin-accounts-browser.cjs
          node tests/agent-accounts-browser.cjs
          node tests/common-password-browser.cjs
          node tests/agent-onboarding-browser.cjs
          node tests/call-integration-browser.cjs
          node tests/new-camp-call-browser.cjs
          node tests/import-lifecycle-browser.cjs
          node tests/session-refresh-browser.cjs
          node tests/contact-management-browser.cjs
          npx tailwindcss -i ./tests/responsive-input.css -o ./tests/responsive-generated.css --content './index.html,./*.js' --minify
          node tests/responsive-browser.cjs
      - name: Upload responsive screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: responsive-screenshots
          path: tests/responsive-shots/
          if-no-files-found: ignore
      - name: Production build and SIP asset smoke
        run: |
          npm run build
          node tests/call-build.cjs
      - name: Prepare isolated SQL fixture
        env:
          DEVICES: "2"
          CAMPS: "2"
          CONTACTS: "10"
        run: |
          node loadtest/prepare.mjs
          printf '\ncreate role service_role nologin;\n' >> loadtest/generated/init.sql
          cat supabase/migrations/20261113_work_accounts.sql >> loadtest/generated/init.sql
          cat supabase/migrations/20261113_admin_account_list.sql >> loadtest/generated/init.sql
          cat supabase/migrations/20261113_optional_password_change.sql >> loadtest/generated/init.sql
          cat supabase/migrations/20261113_agent_account_list.sql >> loadtest/generated/init.sql
          cat supabase/migrations/20261113_agent_common_password.sql >> loadtest/generated/init.sql
          cat supabase/migrations/20261113_call_transport_policy.sql >> loadtest/generated/init.sql
          cat supabase/migrations/20261113_new_camp_call_transport.sql >> loadtest/generated/init.sql
          cat supabase/migrations/20261113_voter_import_lifecycle.sql >> loadtest/generated/init.sql
          cat supabase/migrations/20261113_contact_management.sql >> loadtest/generated/init.sql
          docker compose --env-file loadtest/.env -f loadtest/compose.yaml up --build -d
          for n in $(seq 1 90); do
            if docker compose --env-file loadtest/.env -f loadtest/compose.yaml exec -T db psql -U postgres -d easycall_test -tAc "select position('callPolicy' in pg_get_functiondef('public.easycall_admin_save_camp(jsonb,timestamptz,uuid)'::regprocedure))>0" | grep -q t; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Actual PostgreSQL authorization rollback checks
        run: |
          docker compose --env-file loadtest/.env -f loadtest/compose.yaml exec -T db psql -v ON_ERROR_STOP=1 -U postgres -d easycall_test < tests/work-accounts-rollback.sql
          docker compose --env-file loadtest/.env -f loadtest/compose.yaml exec -T db psql -v ON_ERROR_STOP=1 -U postgres -d easycall_test < tests/agent-accounts-rollback.sql
          docker compose --env-file loadtest/.env -f loadtest/compose.yaml exec -T db psql -v ON_ERROR_STOP=1 -U postgres -d easycall_test < tests/common-password-rollback.sql
          docker compose --env-file loadtest/.env -f loadtest/compose.yaml exec -T db psql -v ON_ERROR_STOP=1 -U postgres -d easycall_test < tests/call-transport-policy-rollback.sql
          docker compose --env-file loadtest/.env -f loadtest/compose.yaml exec -T db psql -v ON_ERROR_STOP=1 -U postgres -d easycall_test < tests/new-camp-call-rollback.sql
          docker compose --env-file loadtest/.env -f loadtest/compose.yaml exec -T db psql -v ON_ERROR_STOP=1 -U postgres -d easycall_test < tests/voter-import-rollback.sql
          docker compose --env-file loadtest/.env -f loadtest/compose.yaml exec -T db psql -v ON_ERROR_STOP=1 -U postgres -d easycall_test < tests/import-lifecycle-rollback.sql
          docker compose --env-file loadtest/.env -f loadtest/compose.yaml exec -T db psql -v ON_ERROR_STOP=1 -U postgres -d easycall_test < tests/contact-management-rollback.sql
      - name: Collect stack diagnostics
        if: failure()
        run: docker compose --env-file loadtest/.env -f loadtest/compose.yaml logs --tail 80
      - name: Stop isolated stack
        if: always()
        run: docker compose --env-file loadtest/.env -f loadtest/compose.yaml down
