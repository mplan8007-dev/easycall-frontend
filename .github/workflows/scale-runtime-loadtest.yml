name: Isolated 2000-device capacity test
on:
  workflow_dispatch:
  push:
    branches: ["perf/scale-2000-runtime"]
    paths:
      - ".github/workflows/scale-runtime-loadtest.yml"
      - "loadtest/**"
      - "supabase/migrations/20261112_scale_runtime.sql"
permissions:
  contents: read
concurrency:
  group: isolated-capacity-${{ github.ref }}
  cancel-in-progress: true
jobs:
  capacity:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        camps: [1, 20]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Regression tests
        run: node --test tests/operations.test.cjs tests/admin-console.test.cjs tests/access-and-lists.test.cjs tests/runtime-scheduler.test.cjs tests/runtime-scaling.test.cjs
      - name: Prepare fictional, local-only fixture
        env:
          DEVICES: "2000"
          CAMPS: ${{ matrix.camps }}
          CONTACTS: "200000"
        run: node loadtest/prepare.mjs
      - name: Start isolated PostgreSQL and API
        run: |
          docker compose --env-file loadtest/.env -f loadtest/compose.yaml up --build -d
          for n in $(seq 1 60); do
            if curl --silent --fail http://127.0.0.1:54330/ > /dev/null; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Sustain 2000 authenticated devices for 15 minutes
        env:
          DEVICES: "2000"
          DURATION_SECONDS: "900"
          RAMP_SECONDS: "120"
          CALL_INTERVAL_SECONDS: "60"
        run: node loadtest/run.mjs
      - name: Record isolated machine and container resources
        if: always()
        run: |
          mkdir -p loadtest/results
          node -e "const o=require('os');require('fs').writeFileSync('loadtest/results/machine.json',JSON.stringify({cpus:o.cpus().length,memoryBytes:o.totalmem(),platform:o.platform()},null,2))"
          docker stats --no-stream > loadtest/results/container-stats.txt || true
          docker compose --env-file loadtest/.env -f loadtest/compose.yaml logs --tail 80 > loadtest/results/stack.log || true
          cat loadtest/results/capacity-*.json || true
          cat loadtest/results/machine.json || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: isolated-2000-devices-${{ matrix.camps }}-camps
          path: loadtest/results/
          retention-days: 14
      - name: Remove isolated containers
        if: always()
        run: docker compose --env-file loadtest/.env -f loadtest/compose.yaml down
