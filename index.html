<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>이지콜 (EasyCall) - 멀티테넌트 SaaS PDS 플랫폼</title>
  <!-- Supabase 라이브러리 로드 -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Malgun Gothic", sans-serif; background-color: #0f172a; color: #f8fafc; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
    
    /* 공통 레이아웃 */
    .hidden { display: none !important; }
    .flex { display: flex; }
    
    /* 로그인 화면 스타일 */
    #login-container { flex: 1; display: flex; justify-content: center; align-items: center; background: radial-gradient(circle, #1e293b 0%, #0f172a 100%); }
    .login-box { background: #1e293b; border: 1px solid #334155; padding: 40px; border-radius: 12px; width: 400px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
    .login-box h2 { font-size: 1.5rem; color: #38bdf8; margin-bottom: 24px; text-align: center; }
    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; font-size: 0.85rem; color: #94a3b8; margin-bottom: 6px; }
    .form-input { width: 100%; padding: 12px; background: #0f172a; border: 1px solid #475569; color: #fff; border-radius: 6px; font-size: 0.95rem; }
    .btn-primary { width: 100%; padding: 14px; background: #2563eb; color: #fff; border: none; border-radius: 6px; font-weight: bold; font-size: 1rem; cursor: pointer; margin-top: 10px; }
    .btn-primary:hover { background: #1d4ed8; }

    /* 대시보드 공통 헤더 */
    .app-header { height: 60px; background: #1e293b; border-bottom: 1px solid #334155; display: flex; align-items: center; justify-content: space-between; padding: 0 24px; }
    .header-title { font-size: 1.2rem; font-weight: bold; color: #38bdf8; display: flex; align-items: center; gap: 10px; }
    .header-info { display: flex; gap: 20px; font-size: 0.9rem; color: #94a3b8; }
    .btn-logout { background: #dc2626; color: #fff; border: none; padding: 6px 14px; border-radius: 4px; font-weight: bold; cursor: pointer; }

    /* 워크스페이스 본문 */
    .app-body { flex: 1; padding: 24px; overflow-y: auto; display: flex; flex-direction: column; gap: 20px; background: #f1f5f9; color: #1e293b; }
    .super-body { flex: 1; padding: 24px; overflow-y: auto; display: flex; flex-direction: column; gap: 20px; background: #0f172a; color: #f8fafc; }

    /* 카드 및 패널 */
    .card { background: #fff; border: 1px solid #cbd5e1; border-radius: 8px; padding: 20px; }
    .card-dark { background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 20px; color: #f8fafc; }
    
    /* 테이블 */
    .data-table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
    .data-table th, .data-table td { padding: 12px; text-align: left; border-bottom: 1px solid #e2e8f0; }
    .data-table th { color: #64748b; font-weight: 600; }
    .data-table-dark th, .data-table-dark td { padding: 12px; text-align: left; border-bottom: 1px solid #334155; color: #f8fafc; }
    
    .badge { padding: 4px 8px; border-radius: 4px; font-size: 0.75rem; font-weight: bold; }
    .badge-우호 { background: #dcfce7; color: #15803d; }
    .badge-부동 { background: #fef9c3; color: #854d0e; }
    .badge-미분류 { background: #f1f5f9; color: #64748b; }
  </style>
</head>
<body>

  <!-- ================= 1. 통합 로그인 화면 ================= -->
  <div id="login-container">
    <div class="login-box">
      <h2>이지콜 (EasyCall) 로그인</h2>
      <div class="form-group">
        <label>계정 아이디</label>
        <input type="text" id="login-id" class="form-input" placeholder="super 또는 camp01 또는 agent01">
      </div>
      <div class="form-group">
        <label>비밀번호</label>
        <input type="password" id="login-pw" class="form-input" placeholder="••••••••">
      </div>
      <button class="btn-primary" onclick="handleLogin()">로그인 및 역할 분기</button>
      <div style="margin-top: 16px; font-size: 0.8rem; color: #64748b; text-align: center; line-height: 1.4;">
        * 테스트 계정:<br>
        슈퍼관리자: <strong>super</strong> / 캠프관리자: <strong>camp01</strong> / 요원: <strong>agent01</strong>
      </div>
    </div>
  </div>

  <!-- ================= 2. 슈퍼 관리자 (SaaS 본사) 화면 ================= -->
  <div id="view-super" class="hidden" style="flex: 1; flex-direction: column; height: 100vh;">
    <header class="app-header" style="background: #1e1b4b; border-color: #312e81;">
      <div class="header-title"><span style="color: #818cf8;">🌐 이지콜 SaaS 플랫폼 본사 (슈퍼 관리자)</span></div>
      <div class="header-info">
