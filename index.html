<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>이지콜 (EasyCall) - 선거 맞춤형 SaaS PDS 플랫폼</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: 'Pretendard', sans-serif; user-select: none; background-color: #0f172a; }
    .custom-scrollbar::-webkit-scrollbar { width: 6px; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    @keyframes pulse-red { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
    .animate-pulse-red { animation: pulse-red 1.5s infinite; }
  </style>
</head>
<body class="h-screen w-screen overflow-hidden flex flex-col text-slate-800">

  <!-- ==================== A. 일반 사용자 (캠프관리자/요원) 로그인 화면 ==================== -->
  <div id="login-view" class="fixed inset-0 bg-slate-950 flex items-center justify-center z-50">
    <div class="bg-slate-900 border border-slate-800 p-8 rounded-2xl w-[420px] shadow-2xl">
      <div class="flex items-center gap-3 mb-6">
        <div class="w-10 h-10 rounded-xl bg-blue-600 text-white flex items-center justify-center font-bold text-xl">
          <i class="fa-solid fa-phone-volume"></i>
        </div>
        <div>
          <h2 class="text-xl font-extrabold text-white">이지콜 (EasyCall) 상황실</h2>
          <p class="text-xs text-slate-400">선거 전용 캠프 및 요원 로그인</p>
        </div>
      </div>
      <div class="space-y-4">
        <div>
          <label class="block text-xs font-bold text-slate-400 mb-1.5 uppercase">캠프관리자 또는 요원 아이디</label>
          <input type="text" id="login-id" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-white text-sm focus:outline-none focus:border-blue-500" placeholder="camp01 또는 agent01">
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-400 mb-1.5 uppercase">비밀번호</label>
          <input type="password" id="login-pw" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-white text-sm focus:outline-none focus:border-blue-500" placeholder="••••••••">
        </div>
        <button onclick="handleUserLogin()" class="w-full py-3.5 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl transition shadow-lg">
          상황실 / 태블릿 로그인
        </button>
      </div>
      <div class="mt-6 pt-4 border-t border-slate-800 flex justify-between items-center text-xs">
        <span class="text-slate-500">본사 관리자이신가요?</span>
        <a href="?portal=super" class="text-indigo-400 hover:underline font-bold">최고관리자 전용 포털 ➔</a>
      </div>
    </div>
  </div>

  <!-- ==================== B. 최고관리자 (SaaS 본사) 전용 로그인 화면 ==================== -->
  <div id="super-login-view" class="fixed inset-0 bg-indigo-950 flex items-center justify-center z-50 hidden">
    <div class="bg-indigo-900 border border-indigo-800 p-8 rounded-2xl w-[420px] shadow-2xl">
      <div class="flex items-center gap-3 mb-6">
        <div class="w-10 h-10 rounded-xl bg-indigo-600 text-white flex items-center justify-center font-bold text-xl">
          <i class="fa-solid fa-shield-halved"></i>
        </div>
        <div>
          <h2 class="text-xl font-extrabold text-white">이지콜 본사 관제센터</h2>
          <p class="text-xs text-indigo-300">최고관리자 보안 인증 포털</p>
        </div>
      </div>
      <div class="space-y-4">
        <div>
          <label class="block text-xs font-bold text-indigo-300 mb-1.5 uppercase">마스터 관리자 ID</label>
          <input type="text" id="super-login-id" class="w-full bg-indigo-950 border border-indigo-700 rounded-xl p-3 text-white text-sm focus:outline-none focus:border-indigo-400" placeholder="super">
        </div>
        <div>
          <label class="block text-xs font-bold text-indigo-300 mb-1.5 uppercase">마스터 비밀번호</label>
          <input type="password" id="super-login-pw" class="w-full bg-indigo-950 border border-indigo-700 rounded-xl p-3 text-white text-sm focus:outline-none focus:border-indigo-400" placeholder="••••••••">
        </div>
        <button onclick="handleSuperLogin()" class="w-full py-3.5 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl transition shadow-lg">
          본사 마스터 로그인
        </button>
      </div>
      <div class="mt-6 pt-4 border-t border-indigo-800 flex justify-between items-center text-xs">
        <a href="./" class="text-indigo-300 hover:underline">⬅ 일반 로그인으로 돌아가기</a>
      </div>
    </div>
  </div>

  <!-- ==================== 1. 최고관리자 관제 대시보드 ==================== -->
  <div id="super-view" class="hidden h-full flex flex-col bg-slate-950 text-slate-100">
    <header class="h-16 bg-slate-900 border-b border-slate-800 px-6 flex items-center justify-between">
      <h1 class="text-lg font-bold text-indigo-400">🌐 이지콜 SaaS 본사 관제센터 (최고관리자)</h1>
      <button onclick="handleLogout()" class="bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded-xl text-xs font-bold">로그아웃</button>
    </header>
    <main class="flex-1 p-6 grid grid-cols-3 gap-6 overflow-y-auto">
      <div class="col-span-2 bg-slate-900 border border-slate-800 rounded-2xl p-6">
        <h3 class="text-base font-bold text-indigo-300 mb-4">📋 전체 선거 캠프 라이선스 및 예치금 현황</h3>
        <table class="w-full text-left text-sm">
          <thead class="text-slate-400 border-b border-slate-800">
            <tr><th class="pb-3">캠프명</th><th class="pb-3">관리자 ID</th><th class="pb-3">태블릿 대수</th><th class="pb-3">잔여 예치금</th><th class="pb-3">상태 제어</th></tr>
          </thead>
          <tbody id="super-camps-body" class="divide-y divide-slate-800">
            <tr><td colspan="5" class="py-4 text-center text-slate-500">데이터 로딩 중...</td></tr>
          </tbody>
        </table>
      </div>
      <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 flex flex-col justify-between">
        <div>
          <h3 class="text-base font-bold text-indigo-300 mb-4">➕ 신규 캠프 개설 및 예치금 충전</h3>
          <div class="space-y-4">
            <div><label class="block text-xs text-slate-400 mb-1">캠프명</label><input type="text" id="new-camp-name" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm text-white" placeholder="보령시·서천군 캠프"></div>
            <div><label class="block text-xs text-slate-400 mb-1">관리자 ID</label><input type="text" id="new-camp-admin" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm text-white" placeholder="camp01"></div>
            <div><label class="block text-xs text-slate-400 mb-1">태블릿 라이선스 대수</label><input type="number" id="new-camp-limit" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm text-white" value="15"></div>
            <div><label class="block text-xs text-slate-400 mb-1">초기 예치금 (원)</label><input type="number" id="new-camp-balance" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm text-white" value="500000"></div>
          </div>
        </div>
        <button onclick="registerCampBySuper()" class="w-full py-3.5 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl transition">캠프 개설 승인</button>
      </div>
    </main>
  </div>

  <!-- ==================== 2. 캠프관리자 화면 ==================== -->
  <div id="admin-view" class="hidden h-full flex flex-col bg-slate-100 text-slate-800">
    <header class="h-16 bg-white border-b border-slate-200 px-6 flex items-center justify-between">
      <h1 class="text-lg font-bold text-blue-600">📊 선거 캠프 상황실 (상황실장 대시보드)</h1>
      <button onclick="handleLogout()" class="bg-red-600 hover:bg-red-700 text-white px-4 py-
