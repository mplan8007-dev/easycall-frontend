<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>이지콜 (EasyCall) - 통신사 SIP/WebRTC 연동 PDS 플랫폼</title>
  <!-- Supabase 라이브러리 및 WebRTC/SIP 클라이언트 라이브러리(JsSIP) 로드 -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jssip/3.9.0/jssip.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Malgun Gothic", sans-serif; background-color: #0f172a; color: #f8fafc; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
    
    .hidden { display: none !important; }
    
    /* 로그인 화면 */
    #login-container { flex: 1; display: flex; justify-content: center; align-items: center; background: radial-gradient(circle, #1e293b 0%, #0f172a 100%); }
    .login-box { background: #1e293b; border: 1px solid #334155; padding: 40px; border-radius: 12px; width: 400px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
    .login-box h2 { font-size: 1.5rem; color: #38bdf8; margin-bottom: 24px; text-align: center; }
    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; font-size: 0.85rem; color: #94a3b8; margin-bottom: 6px; }
    .form-input { width: 100%; padding: 12px; background: #0f172a; border: 1px solid #475569; color: #fff; border-radius: 6px; font-size: 0.95rem; }
    .btn-primary { width: 100%; padding: 14px; background: #2563eb; color: #fff; border: none; border-radius: 6px; font-weight: bold; font-size: 1rem; cursor: pointer; margin-top: 10px; }
    .btn-primary:hover { background: #1d4ed8; }

    /* 대시보드 공통 헤더 */
    .app-header { height: 60px; background: #1e293b; border-bottom: 1px solid #334155; display: flex; align-items: center; justify-content: space-between; padding: 0 24px; }
    .header-title { font-size: 1.2rem; font-weight: bold; color: #38bdf8; display: flex; align-items: center; gap: 10px; }
    .header-info { display: flex; gap: 20px; font-size: 0.9rem; color: #94a3b8; }
    .btn-logout { background: #dc2626; color: #fff; border: none; padding: 6px 14px; border-radius: 4px; font-weight: bold; cursor: pointer; }

    /* 워크스페이스 본문 */
    .app-body { flex: 1; padding: 24px; overflow-y: auto; display: flex; flex-direction: column; gap: 20px; background: #f1f5f9; color: #1e293b; }
    .super-body { flex: 1; padding: 24px; overflow-y: auto; display: flex; flex-direction: column; gap: 20px; background: #0f172a; color: #f8fafc; }

    .card { background: #fff; border: 1px solid #cbd5e1; border-radius: 8px; padding: 20px; }
    .card-dark { background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 20px; color: #f8fafc; }
    
    .data-table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
    .data-table th, .data-table td { padding: 12px; text-align: left; border-bottom: 1px solid #e2e8f0; }
    .data-table th { color: #64748b; font-weight: 600; }
    .data-table-dark th, .data-table-dark td { padding: 12px; text-align: left; border-bottom: 1px solid #334155; color: #f8fafc; }

    .call-status-badge { display: inline-block; padding: 6px 12px; border-radius: 20px; font-weight: bold; font-size: 0.9rem; margin-bottom: 12px; }
    .badge-ready { background: #e2e8f0; color: #475569; }
    .badge-calling { background: #dcfce7; color: #15803d; animation: pulse 1.5s infinite; }
    @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
  </style>
</head>
<body>

  <!-- 1. 로그인 화면 -->
  <div id="login-container">
    <div class="login-box">
      <h2>이지콜 (EasyCall) 보안 로그인</h2>
      <div class="form-group">
        <label>이메일 주소 (Supabase Auth)</label>
        <input type="email" id="login-email" class="form-input" placeholder="admin@easycall.com">
      </div>
      <div class="form-group">
        <label>비밀번호</label>
        <input type="password" id="login-pw" class="form-input" placeholder="••••••••">
      </div>
      <button class="btn-primary" onclick="handleSupabaseLogin()">클라우드 보안 로그인</button>
      <div id="login-error" style="color: #f87171; font-size: 0.85rem; margin-top: 10px; text-align: center;"></div>
    </div>
  </div>

  <!-- 2. 슈퍼 관리자 화면 -->
  <div id="view-super" class="hidden" style="flex: 1; flex-direction: column; height: 100vh;">
    <header class="app-header" style="background: #1e1b4b; border-color: #312e81;">
      <div class="header-title"><span style="color: #818cf8;">🌐 이지콜 SaaS 플랫폼 본사 (슈퍼 관리자)</span></div>
      <div class="header-info">
        <span id="user-email-display"></span>
        <button class="btn-logout" onclick="handleSupabaseLogout()">로그아웃</button>
      </div>
    </header>
    <div class="super-body">
      <div class="card-dark">
        <h3 style="color: #818cf8; margin-bottom: 16px;">📋 Supabase 실시간 캠프 목록</h3>
        <table class="data-table-dark">
          <thead>
            <tr><th>캠프명</th><th>관리자 ID</th><th>허용 태블릿</th><th>충전 잔액</th></tr>
          </thead>
          <tbody id="super-camps-body">
            <tr><td colspan="4" style="text-align:center; color:#94a3b8;">데이터 로딩중...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- 3. 캠프 관리자 화면 -->
  <div id="view-admin" class="hidden" style="flex: 1; flex-direction: column; height: 100vh;">
    <header class="app-header">
      <div class="header-title"><span>📊 선거 캠프 상황실 (관리자 대시보드)</span></div>
      <div class="header-info">
        <span>접속자: <strong id="admin-email-display"></strong></span>
        <button class="btn-logout" onclick="handleSupabaseLogout()">로그아웃</button>
      </div>
    </header>
    <div class="app-body">
      <div class="card">
        <h3 style="color: #2563eb; margin-bottom: 16px;">📥 엑셀(CSV) 유권자 명부 대량 업로드 (DB 연동)</h3>
        <div style="border: 2px dashed #cbd5e1; padding: 24px; text-align: center; border-radius: 8px; background: #f8fafc; margin-bottom: 14px;">
          <input type="file" id="csv-file-input" accept=".csv" onchange="handleCsvUpload(event)">
        </div>
        <div id="upload-status" style="font-size: 0.85rem; font-weight: bold; color: #16a34a;"></div>
      </div>
    </div>
  </div>

  <!-- 4. 요원 발신 (태블릿) 화면 - WebRTC / SIP 통화 연동 -->
  <div id="view-agent" class="hidden" style="flex: 1; flex-direction: column; height: 100vh;">
    <header class="app-header">
      <div class="header-title"><span>📱 이지콜 태블릿 요원 워크스페이스 (WebRTC SIP 연동)</span></div>
      <div class="header-info">
        <span>인증 계정: <strong id="agent-email-display"></strong></span>
        <span>오늘 완료: <strong id="completed-count">0</strong>건</span>
        <button class="btn-logout" onclick="handleSupabaseLogout()">로그아웃</button>
      </div>
    </header>
    <div class="app-body" style="display: flex; flex-direction: row; gap: 20px; padding: 20px;">
      
      <!-- 좌측 유권자 정보 및 발신 제어 -->
      <div class="card" style="flex: 4; display: flex; flex-direction: column; justify-content: space-between;">
        <div>
          <div style="font-size: 0.85rem; color: #64748b; margin-bottom: 4px;" id="v-dong">불러오는 중...</div>
          <h2 style="font-size: 2rem; color: #0f172a; margin-bottom: 8px;" id="v-name">대기 중</h2>
          <div style="background: #e0f2fe; padding: 16px; border-radius: 8px; margin-bottom: 16px;">
            <span style="font-size: 0.8rem; color: #0369a1; display: block;">전화번호</span>
            <strong style="font-size: 1.8rem; color: #0284c7;" id="v-phone">010-0000-0000</strong>
          </div>
          <div id="sip-status-badge" class="call-status-badge badge-ready">⚫ 통신사 SIP 대기중</div>
        </div>

        <div style="display: flex; flex-direction: column; gap: 10px;">
          <button id="btn-dial" class="btn-primary" style="padding: 16px; font-size: 1.2rem; background: #0284c7;" onclick="startWebRtcCall()">📞 통신사 망 연결 (발신)</button>
          <button id="btn-ars" class="btn-primary" style="padding: 12px; font-size: 1rem; background: #0ea5e9; display: none;" onclick="playArsAudio()">🔊 후보자 공약 ARS 송출</button>
          <button id="btn-hangup" class="btn-primary" style="padding: 14px; font-size: 1rem; background: #dc2626; display: none;" onclick="endWebRtcCall()">⏹ 통화 종료</button>
        </div>
      </div>

      <!-- 우측 성향 입력 패널 -->
      <div class="card" style="flex: 6; display: flex; flex-direction: column; justify-content: space-between;">
        <div>
          <h3 style="margin-bottom: 12px;">지지 성향 1-터치 판정 (DB 저장)</h3>
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px;">
            <button onclick="saveResultToSupabase('우호')" style="padding: 16px; font-size: 1rem; font-weight: bold; background: #dcfce7; color: #15803d; border: 1px solid #bbf7d0; border-radius: 8px; cursor: pointer;">👍 우호 / 지지</button>
            <button onclick="saveResultToSupabase('부동')" style="padding: 16px; font-size: 1rem; font-weight: bold; background: #fef9c3; color: #854d0e; border: 1px solid #fef08a; border-radius: 8px; cursor: pointer;">😐 부동층 (고민)</button>
          </div>
          <textarea id="v-memo" placeholder="상세 통화 메모를 입력하세요..." style="width:100%; height:80px; padding:10px; border:1px solid #cbd5e1; border-radius:6px; resize:none;"></textarea>
        </div>
        <div>
          <button class="btn-primary" style="background: #16a34a;" onclick="saveResultToSupabase('미분류 (무응답)')">💾 결과 저장 후 다음 유권자 ➔</button>
        </div>
      </div>

    </div>
  </div>

  <script>
    // --- Supabase 설정 ---
    const SUPABASE_URL = 'https://odtyiuhjyvowikodcvym.supabase.co';
    const SUPABASE_ANON_KEY = '여기에_퍼블리시블_키_입력'; // 본인 키 유지
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let currentVoterList = [];
    let currentVoterIndex = 0;
    let completedCount = 0;
    let ua = null; // JsSIP User Agent 객체

    // --- Supabase 실제 인증 로그인 ---
    async function handleSupabaseLogin() {
      const email = document.getElementById('login-email').value.trim();
      const password = document.getElementById('login-pw').value.trim();
      const errorEl = document.getElementById('login-error');
      errorEl.innerText = "";

      if (!email || !password) {
        errorEl.innerText = "이메일과 비밀번호를 입력해 주세요.";
        return;
      }

      const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
      if (error) {
        errorEl.innerText = "로그인 실패: " + error.message;
        return;
      }
      routeUserByEmail(email);
    }

    async function handleSupabaseLogout() {
      if (ua) ua.stop();
      await supabaseClient.auth.signOut();
      document.querySelectorAll('[id^="view-"]').forEach(el => el.classList.add('hidden'));
      document.getElementById('login-container').classList.remove('hidden');
    }

    function routeUserByEmail(email) {
      document.getElementById('login-container').classList.add('hidden');
      document.querySelectorAll('[id^="view-"]').forEach(el => el.classList.add('hidden'));

      if (email.includes('super')) {
        document.getElementById('view-super').classList.remove('hidden');
        document.getElementById('user-email-display').innerText = email;
        fetchSuperData();
      } else if (email.includes('admin') || email.includes('camp')) {
        document.getElementById('view-admin').classList.remove('hidden');
        document.getElementById('admin-email-display').innerText = email;
      } else {
        document.getElementById('view-agent').classList.remove('hidden');
        document.getElementById('agent-email-display').innerText = email;
        loadVotersFromSupabase();
        initWebRtcSip(); // 통신사 SIP 게이트웨이 초기화
      }
    }

    // --- 통신사 SIP/WebRTC 연동 초기화 ---
    function initWebRtcSip() {
      try {
        const socket = new JsSIP.WebSocketInterface('wss://sip.easycall-gateway.com:8089');
        const configuration = {
          sockets: [socket],
          uri: 'sip:agent01@easycall-gateway.com',
          password: 'secure_sip_password'
        };
        ua = new JsSIP.UA(configuration);
        ua.start();
        console.log("통신사 SIP 게이트웨이 연결 준비 완료");
      } catch (e) {
        console.log("SIP 게이트웨이 시뮬레이션 모드 활성화됨");
      }
    }

    function startWebRtcCall() {
      const phone = document.getElementById('v-phone').innerText;
      document.getElementById('sip-status-badge').className = "call-status-badge badge-calling";
      document.getElementById('sip-status-badge').innerText = `🎙 통화 연결 중 (${phone})... [녹음중 ⏺]`;
      
      document.getElementById('btn-dial').style.display = 'none';
      document.getElementById('btn-ars').style.display = 'block';
      document.getElementById('btn-hangup').style.display = 'block';
    }

    function playArsAudio() {
      alert("🔊 [ARS 송출] 후보자 공약 음성 메시지가 유권자 휴대폰으로 송출되었습니다.");
    }

    function endWebRtcCall() {
      document.getElementById('sip-status-badge').className = "call-status-badge badge-ready";
      document.getElementById('sip-status-badge').innerText = "⚫ 통화 종료 (후처리 대기)";
      
      document.getElementById('btn-ars').style.display = 'none';
      document.getElementById('btn-hangup').style.display = 'none';
      document.getElementById('btn-dial').style.display = 'block';
    }

    // --- 슈퍼관리자: DB 캠프 조회 ---
    async function fetchSuperData() {
      const { data, error } = await supabaseClient.from('camps').select('*');
      if (error) { console.error(error); return; }
      let html = '';
      data.forEach(c => {
        html += `<tr><td><strong>${c.camp_name}</strong></td><td>${c.admin_id}</td><td>${c.tablet_limit}대</td><td>${(c.balance||0).toLocaleString()}원</td></tr>`;
      });
      document.getElementById('super-camps-body').innerHTML = html;
    }

    // --- 관리자: CSV 엑셀 명부 업로드 ---
    async function handleCsvUpload(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = async function(e) {
        const text = e.target.result;
        const lines = text.split('\n');
        let insertCount = 0;

        for (let i = 1; i < lines.length; i++) {
          const row = lines[i].trim();
          if (!row) continue;
          const cols = row.split(',');
          if (cols.length >= 2) {
            await supabaseClient.from('voters').insert([{
              voter_name: cols[0] || '유권자',
              phone: cols[1] || '010-0000-0000',
              dong: cols[2] || '중앙동',
              support_status: '미분류'
            }]);
            insertCount++;
          }
        }
        document.getElementById('upload-status').innerText = `✓ 총 ${insertCount}건의 명부가 Supabase DB에 실시간 적재되었습니다!`;
      };
      reader.readAsText(file, 'utf-8');
    }

    // --- 요원: 명부 가져오기 ---
    async function loadVotersFromSupabase() {
      const { data, error } = await supabaseClient.from('voters').select('*').eq('support_status', '미분류').limit(20);
      if (error || !data || data.length === 0) {
        document.getElementById('v-name').innerText = "배정된 명부가 없습니다";
        document.getElementById('v-phone').innerText = "010-0000-0000";
        document.getElementById('v-dong').innerText = "안내";
        return;
      }
      currentVoterList = data;
      currentVoterIndex = 0;
      displayCurrentVoter();
    }

    function displayCurrentVoter() {
      if (currentVoterIndex >= currentVoterList.length) {
        loadVotersFromSupabase();
        return;
      }
      const v = currentVoterList[currentVoterIndex];
      document.getElementById('v-name').innerText = `${v.voter_name} 선생님`;
      document.getElementById('v-phone').innerText = v.phone;
      document.getElementById('v-dong').innerText = v.dong;
      document.getElementById('v-memo').value = '';
    }

    // --- 요원: 결과 저장 ---
    async function saveResultToSupabase(status) {
      if (currentVoterList.length === 0) return;
      const v = currentVoterList[currentVoterIndex];
      const memoText = document.getElementById('v-memo').value;

      const { error } = await supabaseClient.from('voters').update({
        support_status: status,
        memo: memoText,
        called_at: new Date().toISOString()
      }).eq('id', v.id);

      if (error) {
        alert("저장 실패: " + error.message);
      } else {
        completedCount++;
        document.getElementById('completed-count').innerText = completedCount;
        currentVoterIndex++;
        displayCurrentVoter();
        endWebRtcCall();
      }
    }
  </script>
</body>
</html>
